<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="costgate">
  <defs>
    <linearGradient id="cgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- hexagon badge (modern, strong favicon identity) -->
  <path d="M32 4 L56 18 V46 L32 60 L8 46 V18 Z" fill="url(#cgGrad)"/>
  <!-- gate: a single opening to the right (one egress) -->
  <path d="M30 20 a12 12 0 1 0 0 24" fill="none" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round"/>
  <!-- the one audited ledger passing through -->
  <line x1="30" y1="32" x2="46" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- audit tick: this charge is verified -->
  <path d="M40 28 l4 4 l6 -8" fill="none" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
