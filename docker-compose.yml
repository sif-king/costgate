services:
  codex-proxy:
    build:
      context: .
      dockerfile: Dockerfile.codex
    container_name: multi-proxy-codex
    # 宿主侧缺省只对本机开放（PROXY_BIND=0.0.0.0 才对外）；/admin-api 默认无鉴权，
    # 不要在不设 PROXY_AUTH_TOKEN 的情况下摊到局域网。
    ports:
      - "${PROXY_BIND:-127.0.0.1}:18790:18790"
    env_file:
      - path: codex-proxy/.env
        required: false
    volumes:
      - codex-data:/root/.codex
      - codex-proxy-data:/app
    restart: unless-stopped
    networks:
      - proxy-network

  hermes-proxy:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    container_name: multi-proxy-hermes
    ports:
      - "${PROXY_BIND:-127.0.0.1}:18793:18793"
    env_file:
      - path: hermes-proxy/.env
        required: false
    volumes:
      - hermes-data:/root/.hermes
      - hermes-proxy-data:/app
    restart: unless-stopped
    networks:
      - proxy-network

  cursor-proxy:
    build:
      context: .
      dockerfile: Dockerfile.cursor
    container_name: multi-proxy-cursor
    ports:
      - "${PROXY_BIND:-127.0.0.1}:18794:18794"
    env_file:
      - path: cursor-proxy/.env
        required: false
    volumes:
      - cursor-data:/app/data
    restart: unless-stopped
    networks:
      - proxy-network

  manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
    container_name: multi-proxy-manager
    # 🔴 面板默认只绑回环（server.js 的 BIND_HOST 缺省 127.0.0.1），容器里绑 127.0.0.1
    #    等于宿主端口映射打不到 —— 2026-11-16 实测：`docker compose up -d` 后访问 18792 连不上。
    #    容器内必须绑 0.0.0.0；而 0.0.0.0 会触发 fail-closed（非回环 + 无鉴权 ⇒ 拒绝启动），
    #    所以 MANAGER_PASSWORD 是必需项：这个面板挂载了 docker.sock，等同宿主 root，不能免鉴权。
    #    PANEL_BIND 控制「宿主侧」可达范围，缺省只对本机开放，部署到服务器时显式设 0.0.0.0。
    environment:
      BIND_HOST: "0.0.0.0"
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:?docker 模式必须设 MANAGER_PASSWORD（面板挂载 docker.sock，等同 root）}
    ports:
      - "${PANEL_BIND:-127.0.0.1}:18792:18792"
    env_file:
      - path: multi-proxy-manager/.env
        required: false
    volumes:
      - manager-state:/root/.multi-proxy-manager
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - codex-proxy
      - hermes-proxy
      - cursor-proxy
    restart: unless-stopped
    networks:
      - proxy-network

volumes:
  codex-data:
  hermes-data:
  cursor-data:
  manager-state:
  codex-proxy-data:
  hermes-proxy-data:

networks:
  proxy-network:
    driver: bridge
