<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="costgate">
  <defs>
    <linearGradient id="cgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#cgGrad)"/>
  <!-- gate: a single arch opening (one egress) -->
  <path d="M22 46 V30 a10 10 0 0 1 20 0 V46" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- the one audited ledger passing through the gate -->
  <circle cx="32" cy="33" r="6.2" fill="#ffffff"/>
  <circle cx="32" cy="33" r="6.2" fill="none" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="32" y="36.6" font-size="8" font-weight="800" fill="#1d4ed8" text-anchor="middle" font-family="sans-serif">&#165;</text>
  <!-- audit tick: this charge is verified -->
  <path d="M25 50 l4.2 4.2 l8.4 -9.2" fill="none" stroke="#34d399" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
